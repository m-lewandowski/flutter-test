<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            padding: 20px;
        }
        img {
            max-width: 50%;
            margin: 20px auto;
            display: block;
        }
    </style>
</head>
<body>
    <button id="photo-btn">Dodaj zdjęcie</button>
    <script>
        setTimeout(function() {
            if (window.SnackBar != null) {
                window.SnackBar.postMessage("Hello from JS!");
            }
        }, 5000);
    </script>
    <script>
        window.appendImage = function(image) {
            var imageElement = document.createElement("img");
            imageElement.src = `data:image/png;base64, ${image}`;
            document.body.appendChild(imageElement);
        }
    </script>
    <script>
        window.getUserAgent = function() {
            return window.navigator.userAgent;
        }
    </script>
    <script>
        document.getElementById("photo-btn").addEventListener("click", function() {
            if (window.TakePhoto != null) {
                window.TakePhoto.postMessage("");
            }
        });
    </script>
</body>
</html>
